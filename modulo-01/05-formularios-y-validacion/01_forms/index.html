<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Formularios</title>
    <style>
        body { font-family: system-ui, sans-serif; margin: 1rem; max-width: 40rem; }
        fieldset { margin-bottom: 1rem; }
        label { display: block; margin: 0.4rem 0; }
        input:user-invalid, textarea:user-invalid { outline: 2px solid crimson; }
        #resultado { white-space: pre-wrap; background: #f4f4f4; padding: 0.5rem; }
    </style>
    <script src="./main.js" defer></script>
</head>
<body>
    <form id="formulario">
        <fieldset>
            <legend>¿Recomendarías el curso?</legend>
            <label><input type="radio" name="pregunta" value="si" required> Sí</label>
            <label><input type="radio" name="pregunta" value="no"> No</label>
            <label><input type="radio" name="pregunta" value="nsnc"> NS/NC</label>
        </fieldset>

        <label for="opciones">Módulo favorito</label>
        <select id="opciones" name="opciones">
            <option value="1">Primer valor</option>
            <option value="2">Segundo valor</option>
            <option value="3">Tercer valor</option>
            <option value="4">Cuarto valor</option>
        </select>

        <label for="nombre">Nombre</label>
        <input type="text" id="nombre" name="nombre" required minlength="2">

        <label for="apellidos">Apellidos</label>
        <input type="text" id="apellidos" name="apellidos">

        <label for="email">Correo</label>
        <input type="email" id="email" name="email" required>

        <label for="descripcion">Descripción</label>
        <textarea id="descripcion" name="descripcion" maxlength="200"></textarea>

        <label><input type="checkbox" id="condiciones" name="condiciones" required> He leído y acepto las condiciones</label>
        <label><input type="checkbox" id="privacidad" name="privacidad"> He leído la política de privacidad</label>

        <button>Enviar</button>
    </form>

    <h2>Datos enviados</h2>
    <pre id="resultado"></pre>
</body>
</html>
